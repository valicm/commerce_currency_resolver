services:
  commerce_currency_resolver.manager:
    class: Drupal\commerce_currency_resolver\CurrencyResolverManager
    arguments: [ '@entity_type.manager', '@current_user']
  commerce_currency_resolver.price_resolver:
    class: Drupal\commerce_currency_resolver\Resolver\CurrencyResolverPrice
    arguments: [ '@commerce_price.current_currency', '@config.factory' ]
    tags:
      - { name: commerce_price.price_resolver, priority: 1000 }
  cache_context.currency_resolver:
    class: Drupal\commerce_currency_resolver\Cache\Context\CurrencyResolverCacheContext
    arguments: [ '@commerce_price.current_currency' ]
    tags:
      - { name: cache.context }
  commerce_currency_resolver.order_currency:
    class: Drupal\commerce_currency_resolver\EventSubscriber\CurrencyOrderSubscriber
    arguments: [ '@commerce_currency_resolver.manager', '@commerce_order.order_refresh', '@commerce_price.current_currency' ]
    tags:
      - { name: event_subscriber }
  commerce_currency_resolver.order_processor:
    class: Drupal\commerce_currency_resolver\CurrencyResolverOrderProcessor
    arguments: [ '@commerce_currency_resolver.manager', '@commerce_price.current_currency']
    tags:
      - { name: commerce_order.order_processor, priority: 1000 }
