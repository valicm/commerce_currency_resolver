# Route to get autocomplete results for countries.
commerce_currency_resolver_smart_ip.countries.autocomplete:
  path: '/admin/commerce/config/commerce_currency_resolver/autocomplete'
  defaults:
    _controller: '\Drupal\commerce_currency_resolver_smart_ip\Controller\CountryCurrencyResolverAutocomplete::countriesAutocomplete'
  requirements:
    # use OR conjunction
    _permission: 'administer commerce currency resolver settings'
commerce_currency_resolver_smart_ip.currency_mapping:
  path: '/admin/commerce/config/commerce_currency_resolver/geoip'
  defaults:
    _form: 'Drupal\commerce_currency_resolver_smart_ip\Form\CurrencyResolveGeoipMapping'
    _title: 'Geo mapping'
  requirements:
    _permission: 'administer commerce currency resolver settings'
